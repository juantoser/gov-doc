name: Portal CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build container image
        run: docker build --tag gov-doc-portal:ci .

      - name: Save container image artifact
        run: docker save --output "${RUNNER_TEMP}/gov-doc-portal.tar" gov-doc-portal:ci

      - name: Upload container image artifact
        uses: actions/upload-artifact@v7
        with:
          name: portal-image
          path: ${{ runner.temp }}/gov-doc-portal.tar
          retention-days: 1
